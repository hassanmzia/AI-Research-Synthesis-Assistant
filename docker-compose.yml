version: "3.9"

services:
  # ──────────────────────────────────────────────
  # PostgreSQL – port 5433 (non-default)
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: arsa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: research_assistant
      POSTGRES_USER: arsa_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arsa_secret_2024}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arsa_user -d research_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arsa-network

  # ──────────────────────────────────────────────
  # Redis – port 6380 (non-default)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: arsa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arsa-network

  # ──────────────────────────────────────────────
  # ChromaDB – port 8100 (non-default)
  # ──────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: arsa-chromadb
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "true"
      CHROMA_SERVER_AUTHN_PROVIDER: ""
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - arsa-network

  # ──────────────────────────────────────────────
  # Django Backend – port 3068 (non-default)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arsa-backend
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://arsa_user:${POSTGRES_PASSWORD:-arsa_secret_2024}@postgres:5432/research_assistant
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-me-in-production-abc123xyz}
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://172.168.1.95:3066,http://localhost:3066
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "3068:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - ./sample_papers:/app/sample_papers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - arsa-network

  # ──────────────────────────────────────────────
  # Celery Worker (async tasks)
  # ──────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arsa-celery-worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=4
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://arsa_user:${POSTGRES_PASSWORD:-arsa_secret_2024}@postgres:5432/research_assistant
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-me-in-production-abc123xyz}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - ./sample_papers:/app/sample_papers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - arsa-network

  # ──────────────────────────────────────────────
  # Celery Beat (scheduled tasks)
  # ──────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arsa-celery-beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://arsa_user:${POSTGRES_PASSWORD:-arsa_secret_2024}@postgres:5432/research_assistant
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-me-in-production-abc123xyz}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arsa-network

  # ──────────────────────────────────────────────
  # Celery Flower – port 5556 (non-default)
  # ──────────────────────────────────────────────
  celery-flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arsa-celery-flower
    restart: unless-stopped
    command: celery -A config flower --port=5555 --broker=redis://redis:6379/1
    ports:
      - "5556:5555"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - arsa-network

  # ──────────────────────────────────────────────
  # Node.js API Gateway – port 3067 (non-default)
  # ──────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: arsa-gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DJANGO_BACKEND_URL=http://backend:8000
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-arsa-jwt-secret-change-in-production}
      - CORS_ORIGIN=http://172.168.1.95:3066,http://localhost:3066
    ports:
      - "3067:4000"
    depends_on:
      - backend
      - redis
    networks:
      - arsa-network

  # ──────────────────────────────────────────────
  # React Frontend (built & served by Nginx)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://172.168.1.95:3066/api
        - REACT_APP_WS_URL=ws://172.168.1.95:3066/ws
        - REACT_APP_GATEWAY_URL=http://172.168.1.95:3066/gw
    container_name: arsa-frontend
    restart: unless-stopped
    volumes:
      - frontend_build:/output
    networks:
      - arsa-network

  # ──────────────────────────────────────────────
  # Nginx Reverse Proxy – port 3066 (main site)
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: arsa-nginx
    restart: unless-stopped
    ports:
      - "3066:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
      - media_data:/usr/share/nginx/media:ro
    depends_on:
      - frontend
      - gateway
      - backend
    networks:
      - arsa-network

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  media_data:
  frontend_build:

networks:
  arsa-network:
    driver: bridge
